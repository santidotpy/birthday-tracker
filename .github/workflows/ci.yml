name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # El demo reemplaza tres módulos por alias de Vite, que es de build y no
      # de tipos: si a `consultas.ts`, `tema.ts` o `sesion.ts` les cambia la
      # firma, ni `typecheck` ni `test` se enteran y esto sí. Ver ADR 0008.
      - run: pnpm build:demo

  # La imagen se construye en cada PR para que un cambio en el Dockerfile no se
  # descubra recién al desplegar. No se publica en ningún lado.
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cumpleanos:ci .
